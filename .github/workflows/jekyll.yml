name: Build and Publish LJT-Homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Ensure GitHub Pages source is configured
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          REPO="$GITHUB_REPOSITORY"
          if gh api "repos/$REPO/pages" >/tmp/pages.json 2>/tmp/pages-get.err; then
            echo "GitHub Pages site already exists; ensuring branch source."
            gh api --method PUT "repos/$REPO/pages" \
              -f 'build_type=legacy' \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          else
            echo "GitHub Pages site is absent; attempting to create it from gh-pages."
            gh api --method POST "repos/$REPO/pages" \
              -f 'build_type=legacy' \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/' || {
                echo "::warning::Automatic GitHub Pages enablement was not permitted."
                cat /tmp/pages-get.err || true
              }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production

      - name: Deploy built site to gh-pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
